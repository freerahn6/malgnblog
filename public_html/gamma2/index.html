<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>맑은소프트 블로그 · 관리자 콘솔 (시안 p2)</title>
<!--
  시안-p2-관리자콘솔.html — 클릭 가능한 인터랙티브 목업 (self-contained, 오프라인)
  기획서: 기획-p3-글관리콘솔.md (4장 화면정의 / 9장 체크리스트)
  디자인 토큰: build.py 413~519행 계승 (--bg --card --text --muted --line --accent --accent-soft)
  주의: 전부 목업. 백엔드 연동 없음. 실구현 시 API 계약은 기획서 5장 참조.
  화면ID: S-ADM-1-01 로그인 / S-ADM-1-02 대시보드 / S-ADM-2-01 통계 / S-ADM-3-01 목록 / S-ADM-3-02 편집
-->
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#6b7688;--line:#e6e9f0;--accent:#2563eb;--accent-soft:#e7efff;
  --green:#20a464;--green-soft:#e3f5ec;--gray:#8a94a6;--gray-soft:#eef0f4;--red:#e5484d;--red-soft:#fdeaea;--amber:#c77f16;--amber-soft:#fbf1dc}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#161d2b;--text:#e7ecf3;--muted:#93a0b4;--line:#273043;--accent:#5b8cff;--accent-soft:#1a2540;
  --green:#3ecf8e;--green-soft:#16311f;--gray:#8a94a6;--gray-soft:#222a3a;--red:#ff6b6f;--red-soft:#3a1f22;--amber:#e5a94a;--amber-soft:#352a15}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#161d2b;--text:#e7ecf3;--muted:#93a0b4;--line:#273043;--accent:#5b8cff;--accent-soft:#1a2540;
  --green:#3ecf8e;--green-soft:#16311f;--gray:#8a94a6;--gray-soft:#222a3a;--red:#ff6b6f;--red-soft:#3a1f22;--amber:#e5a94a;--amber-soft:#352a15}
:root[data-theme="light"]{--bg:#f4f6fa;--card:#fff;--text:#1a2233;--muted:#6b7688;--line:#e6e9f0;--accent:#2563eb;--accent-soft:#e7efff;
  --green:#20a464;--green-soft:#e3f5ec;--gray:#8a94a6;--gray-soft:#eef0f4;--red:#e5484d;--red-soft:#fdeaea;--amber:#c77f16;--amber-soft:#fbf1dc}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* ---------- 로그인 게이트 ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gatecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(20,30,50,.10);text-align:center}
.gatecard h1{font-size:19px;margin:0 0 4px}.gatecard p{color:var(--muted);font-size:13px;margin:0 0 22px}
.gatecard input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg);color:var(--text);text-align:center;letter-spacing:.1em}
.gatecard input:focus{outline:none;border-color:var(--accent)}
.gatecard button{width:100%;margin-top:12px;padding:12px;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gatecard button:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
.gatehint{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}
/* ---------- 앱 셸 ---------- */
#app{display:none}
.appbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:10px 16px;flex-wrap:wrap}
.appbar .brand{font-size:15px;font-weight:800;letter-spacing:-.02em;margin-right:8px;white-space:nowrap}
.nav{display:flex;gap:2px}
.nav a{padding:8px 12px;min-height:36px;display:inline-flex;align-items:center;border-radius:8px;font-size:14px;color:var(--muted);font-weight:600}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.appbar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);min-width:36px;min-height:36px;border-radius:8px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 80px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
.pagehead .meta{color:var(--muted);font-size:13px}
.pagehead .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 12px;min-height:36px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.danger:hover{border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
/* ---------- 카드/패널 ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:600}
.stat .val{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel h2 .sp{flex:1}
/* ---------- 테이블 ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
th .arr{font-size:10px;opacity:.6}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
td.rank{width:34px;color:var(--muted);font-weight:700;text-align:center}
tr.rowlink{cursor:pointer}
tr.rowlink:hover{background:var(--accent-soft)}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;margin-top:5px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.title-cell{font-weight:600;max-width:340px}
.title-cell .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
td .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
/* ---------- 칩/배지 ---------- */
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.pub{background:var(--green-soft);color:var(--green)}
.badge.draft{background:var(--gray-soft);color:var(--gray)}
.badge.sched{background:var(--amber-soft);color:var(--amber)}
.badge.trash{background:var(--red-soft);color:var(--red)}
.badge.pending{background:var(--amber-soft);color:var(--amber)}
.funnel{font-size:11px;font-weight:700;color:var(--muted)}
/* ---------- 필터바 ---------- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filterbar select,.filterbar input{padding:8px 10px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:13px}
.filterbar input[type=search]{flex:1;min-width:160px}
.filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--accent)}
.rowact{display:flex;gap:4px;flex-wrap:wrap}
.rowact button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:5px 9px;min-height:30px;border-radius:7px;font-size:12px;cursor:pointer}
.rowact button:hover{border-color:var(--accent);color:var(--accent)}
.rowact button.del:hover{border-color:var(--red);color:var(--red)}
/* ---------- 탭 ---------- */
.tabs{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 14px;min-height:34px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* ---------- 토글 스위치 ---------- */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--gray);border-radius:24px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.switch input:focus-visible+.slider{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- 폼 (편집) ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.done input,.field.done select{border-color:var(--green)}
.field.error input,.field.error select,.field.error textarea{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.field input:disabled,.field textarea:disabled{background:var(--bg);color:var(--muted);cursor:not-allowed}
.field .hint{font-size:12px;color:var(--muted)}
.field .msg{font-size:12px;color:var(--red);min-height:15px}
.field.done .msg{color:var(--green)}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:14px}
/* ---------- 에디터 ---------- */
.editor-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.editor-tabs button{border:0;background:transparent;color:var(--muted);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.editor-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:2px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-top:0;background:var(--bg)}
.toolbar button{min-width:32px;min-height:32px;border:1px solid transparent;background:transparent;color:var(--text);border-radius:6px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-weight:700}
.toolbar button:hover{background:var(--card);border-color:var(--line)}
.toolbar .divider{width:1px;background:var(--line);margin:2px 4px}
.wysiwyg{border:1px solid var(--line);border-top:0;min-height:280px;padding:16px 18px;background:var(--card);font-size:15px;line-height:1.7;overflow-y:auto;max-height:440px}
.wysiwyg:focus{outline:none}
.wysiwyg h2{font-size:19px;margin:18px 0 8px}
.wysiwyg p{margin:0 0 12px}
.wysiwyg ul,.wysiwyg ol{margin:0 0 12px;padding-left:22px}
.wysiwyg table{min-width:0;width:auto;margin:8px 0}
.wysiwyg td,.wysiwyg th{border:1px solid var(--line);padding:6px 10px}
.md-view{display:none}
.md-view textarea{width:100%;min-height:340px;border:1px solid var(--line);border-top:0;padding:16px 18px;background:var(--card);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;resize:vertical}
.md-view textarea:focus{outline:none}
.editor-cap{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.preserve{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.8}
.preserve code{background:var(--card);padding:1px 6px;border-radius:5px;color:var(--text);font-size:12px}
.actionbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:24px -20px -18px;padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;border-radius:0 0 14px 14px}
.actionbar .sp{flex:1}
/* ---------- 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 18px;font-size:14px;color:var(--muted);line-height:1.6}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .diff{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;font-family:ui-monospace,monospace;margin-bottom:16px;white-space:pre-wrap;color:var(--text)}
/* ---------- 토스트 ---------- */
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:tin .25s ease}
.toast.ok{background:var(--green);color:#fff}
.toast.bad{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ---------- 스켈레톤/빈/에러 ---------- */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:14px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.empty,.errbox{text-align:center;padding:44px 20px;color:var(--muted);font-size:14px}
.empty .big,.errbox .big{font-size:34px;margin-bottom:10px}
.errbox{color:var(--red)}
/* SVG 차트 */
#chart svg,#dchart svg{max-width:100%;height:auto}
/* 개발자용 상태 시연 */
.devbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-left:auto}
.devbar select{font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--muted)}
/* prefers-reduced-motion: 모션 대체 (접근성) */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .skel{background:var(--line)}
}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:rgba(255,255,255,.9)}}
</style>
</head>
<body>

<!-- ===================== 로그인 게이트 (S-ADM-1-01) ===================== -->
<div id="gate">
  <form class="gatecard" id="gform">
    <div style="font-size:30px;margin-bottom:8px">🗂️</div>
    <h1>블로그 관리자 콘솔</h1>
    <p>접근하려면 비밀번호를 입력하세요</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" autofocus>
    <button type="submit" id="gbtn"><span id="gbtnlbl">입장</span></button>
    <div class="err" id="gerr" role="alert"></div>
    <div class="gatehint" id="gatehint"></div>
  </form>
</div>

<!-- ===================== 앱 셸 ===================== -->
<div id="app">
  <div class="appbar">
    <span class="brand">🗂️ 맑은소프트 콘솔</span>
    <nav class="nav" id="nav" aria-label="주 메뉴">
      <a href="#/dashboard" data-route="dashboard">대시보드</a>
      <a href="#/stats" data-route="stats">통계</a>
      <a href="#/posts" data-route="posts">글관리</a>
    </nav>
    <span class="sp"></span>
    <button class="iconbtn" id="themebtn" title="테마 전환" aria-label="테마 전환">🌗</button>
    <button class="iconbtn" id="logout" title="나가기" aria-label="나가기">⏻</button>
  </div>
  <div class="wrap" id="view"><!-- 라우팅으로 채움 --></div>
</div>

<!-- 모달 마운트 -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<!-- 토스트 마운트 -->
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   실데이터 연동 (읽기 전용)
     · /api/stats?pw=  → 조회수 집계 {today,total,days,posts:[{path,count}],date}
     · /api/posts?pw=  → 글 메타 매니페스트 {generated,count,posts:[{path,title,category,
                          author,date,updated,funnel,slug,draft,publish_at,status}]}
                          status = published | scheduled | draft
                          (scheduled = publish_at 이 아직 안 온 예약 글. 사이트에는 없다)
     두 응답을 path("/{cat}/{slug}/")로 조인해 POSTS 를 만든다(stats에 없는 글은 views=0).
   ========================================================================= */
var CATL={lms:"LMS",hrd:"HRD",certification:"자격검정",video:"영상",edutech:"에듀테크",news:"소식"};
var PW=null;                 // 인증된 비밀번호(sessionStorage 'bpw'와 동기)
var POSTS=[];                // 조인된 글 목록(발행+비게시)
var STATS={today:0,total:0,days:[],posts:[],date:""};
var DAYS=[];                 // STATS.days (통계 화면이 참조)
var TODAY="";                // STATS.date (KST)
var DATASTATE="loading";     // loading | ok | error  (empty는 각 화면이 실데이터로 판단)
var DEV="normal";            // (구 상태-시연 잔재. 항상 normal — 아래 화면들의 DEV 분기는 비활성)

function buildData(stats,manifest){
  STATS=stats||{today:0,total:0,days:[],posts:[],date:""};
  DAYS=(STATS.days||[]).slice();
  TODAY=STATS.date||"";
  var vmap={};(STATS.posts||[]).forEach(function(p){vmap[p.path]=p.count;});
  POSTS=((manifest&&manifest.posts)||[]).map(function(p){
    return {file:p.path,path:p.path,slug:p.slug||"",title:p.title||"",
      category:p.category||"",author:p.author||"",funnel:p.funnel||"",
      date:p.date||"",updated:p.updated||p.date||"",publish_at:p.publish_at||"",
      // status 는 신규 필드. 옛 매니페스트(draft 만 있던 것)도 읽히도록 폴백을 둔다.
      status:p.status||(p.draft?"draft":"published"),views:vmap[p.path]||0};
  });
}
// 두 API를 함께 부른다. 401이면 code=401 로 던져 게이트 복귀에 쓴다.
function loadData(){
  return Promise.all([
    fetch('/api/stats?pw='+encodeURIComponent(PW)),
    fetch('/api/stats?pw='+encodeURIComponent(PW)+'&posts=1')
  ]).then(function(res){
    var sr=res[0],pr=res[1];
    if(sr.status===401||pr.status===401){var e=new Error('unauthorized');e.code=401;throw e;}
    if(!sr.ok){var e2=new Error('stats '+sr.status);e2.code=sr.status;throw e2;}
    if(!pr.ok){var e3=new Error('posts '+pr.status);e3.code=pr.status;throw e3;}
    return Promise.all([sr.json(),pr.json()]);
  }).then(function(j){buildData(j[0],j[1]);});
}

function manualReload(){

}
function handleLoadError(err){

/* =========================================================================
   라우터 (해시)
   ========================================================================= */
function parseHash(){
  var h=location.hash.replace(/^#\//,'')||'dashboard';
  var q={};var parts=h.split('?');var path=parts[0];
  if(parts[1])parts[1].split('&').forEach(function(kv){var a=kv.split('=');q[a[0]]=decodeURIComponent(a[1]||'')});
  return {path:path.split('/')[0],sub:path.split('/')[1],q:q};
}
function route(){
  if($('app').style.display==='none')return;
  var r=parseHash();
  // 활성 nav
  [].forEach.call($('nav').querySelectorAll('a'),function(a){
    a.classList.toggle('on',a.getAttribute('data-route')===r.path);
  });
  var v=$('view');
  if(DATASTATE==='loading'){v.innerHTML=stateBlock('loading');window.scrollTo(0,0);return;}
  if(DATASTATE==='error'){v.innerHTML='<div class="panel errbox"><div class="big">⚠️</div>데이터를 불러오지 못했습니다.<br><button class="btn primary" style="margin-top:14px" onclick="manualReload()">다시 시도</button></div>';window.scrollTo(0,0);return;}
  if(r.path==='dashboard')renderDashboard(v);
  else if(r.path==='stats')renderStats(v);
  else if(r.path==='posts'&&r.sub==='edit')renderEdit(v,r.q.file);
  else if(r.path==='posts')renderPosts(v);
  else renderDashboard(v);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* 상태별 헬퍼 (로딩/빈/에러 공통 블록) */
function stateBlock(kind,onretry){
  if(kind==='loading')return '<div class="panel"><div class="skel" style="width:40%;height:18px;margin-bottom:16px"></div>'+
    Array(5).join()+'<div class="skel" style="height:14px;margin:12px 0"></div><div class="skel" style="height:14px;margin:12px 0"></div><div class="skel" style="height:14px;margin:12px 0;width:70%"></div></div>';
  if(kind==='empty')return '<div class="panel empty"><div class="big">📭</div>표시할 데이터가 없습니다.</div>';
  if(kind==='error')return '<div class="panel errbox"><div class="big">⚠️</div>데이터를 불러오지 못했습니다.<br><button class="btn primary" style="margin-top:14px" onclick="route()">다시 시도</button></div>';
  return '';
}

/* =========================================================================
   차트 (build.py 스타일 계승)
   ========================================================================= */
function drawChart(mount,days){
  days=days.slice();
  if(!days.length){mount.innerHTML='<p style="color:var(--muted);font-size:13px">아직 데이터가 없습니다.</p>';return;}
  var W=880,H=220,pad=30,ih=H-pad*2,iw=W-pad*2,base=pad+ih;
  var max=Math.max.apply(null,days.map(function(d){return d.count}));if(max<1)max=1;
  var n=days.length;
  var pts=days.map(function(d,i){var x=pad+(n<=1?iw/2:iw*i/(n-1));var y=pad+ih-(d.count/max)*ih;return [x,y,d]});
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area='M '+pad+' '+base+' L '+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L ')+' L '+pts[n-1][0].toFixed(1)+' '+base+' Z';
  var dots=pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="var(--accent)"><title>'+p[2].date+': '+fmt(p[2].count)+'</title></circle>'}).join('');
  function lbl(p){return '<text x="'+p[0].toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+p[2].date.slice(5)+'</text>'}
  var labels=[lbl(pts[0])];if(n>2)labels.push(lbl(pts[Math.floor(n/2)]));if(n>1)labels.push(lbl(pts[n-1]));
  mount.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="일별 조회수 추이">'+
    '<path d="'+area+'" fill="var(--accent-soft)" opacity=".55"/>'+
    '<polyline points="'+poly+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+dots+labels.join('')+'</svg>';
}

var STAT_PERIOD='30';
var STAT_GROUP='none';
function periodDays(){
  if(STAT_PERIOD==='today')return DAYS.slice(-1);
  if(STAT_PERIOD==='7')return DAYS.slice(-7);
  if(STAT_PERIOD==='30')return DAYS.slice(-30);
  return DAYS.slice();
}

  var tabBtn=function(val,lbl){return '<button class="'+(STAT_PERIOD===val?'on':'')+'" onclick="STAT_PERIOD=\''+val+'\';route()">'+lbl+'</button>'};

    '<div class="stat"><div class="lbl">기간 합계</div><div class="val">'+fmt(sum)+'</div></div>'+
    '<div class="stat"><div class="lbl">일 평균</div><div class="val">'+fmt(avg)+'</div></div>'+

    '<button class="'+(STAT_GROUP==='funnel'?'on':'')+'" onclick="STAT_GROUP=\'funnel\';route()">퍼널</button>'+
    '<button class="'+(STAT_GROUP==='author'?'on':'')+'" onclick="STAT_GROUP=\'author\';route()">저자</button>'+

  }
  v.innerHTML=head+
    '<div class="panel"><h2>기간 선택 <span class="sp"></span>'+periodTabs+'</h2><div id="chart"></div></div>'+
    summary+

  var authors=Array.from(new Set(POSTS.map(function(p){return p.author})));

    sel('f-status',F.status,[['all','상태 전체'],['published','게시'],['scheduled','예약'],['draft','비게시']])+
    sel('f-cat',F.cat,[['all','카테고리 전체']].concat(Object.keys(CATL).map(function(k){return [k,CATL[k]]})))+
    sel('f-author',F.author,[['all','저자 전체']].concat(authors.map(function(a){return [a,a]})))+
    sel('f-funnel',F.funnel,[['all','퍼널 전체'],['TOFU','TOFU'],['MOFU','MOFU'],['BOFU','BOFU']])+
    '<input type="search" id="f-q" placeholder="제목·슬러그 검색" value="'+esc(F.q)+'" aria-label="검색">'+
    '</div>';
  v.innerHTML=head+filterbar+'<div class="panel" style="padding:0"><div class="tablewrap" id="ptable"></div></div>';
  // 필터 이벤트
  ['f-status','f-cat','f-author','f-funnel'].forEach(function(id){$(id).addEventListener('change',function(){
    F.status=$('f-status').value;F.cat=$('f-cat').value;F.author=$('f-author').value;F.funnel=$('f-funnel').value;drawTable();});});
  $('f-q').addEventListener('input',function(){F.q=this.value;drawTable();});
  drawTable();
}
function filteredPosts(){
  var list=POSTS.filter(function(p){
    if(F.status!=='all'&&p.status!==F.status)return false;
    if(F.cat!=='all'&&p.category!==F.cat)return false;
    if(F.author!=='all'&&p.author!==F.author)return false;
    if(F.funnel!=='all'&&p.funnel!==F.funnel)return false;
    if(F.q){var q=F.q.toLowerCase();if(p.title.toLowerCase().indexOf(q)<0&&p.slug.toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
  var dir=SORT.dir==='asc'?1:-1;
  list.sort(function(a,b){var x=a[SORT.key],y=b[SORT.key];if(SORT.key==='views'){return (x-y)*dir;}return (x<y?-1:x>y?1:0)*dir;});
  return list;
}
function drawTable(){
  if(!$('ptable'))return;   // 목록 화면이 아닐 때(예: 편집 화면에서 삭제) 안전 종료
  var list=filteredPosts();
  if($('pcount'))$('pcount').textContent=list.length+'건 / 전체 '+POSTS.length+'건';
  var arr=function(k){return SORT.key===k?'<span class="arr">'+(SORT.dir==='asc'?'▲':'▼')+'</span>':''};
  var th=function(k,lbl){return '<th class="sortable" onclick="sortBy(\''+k+'\')">'+lbl+' '+arr(k)+'</th>'};
  var head='<table><thead><tr>'+
    th('title','제목')+'<th>카테고리</th>'+th('author','저자')+th('date','발행일')+th('updated','수정일')+
    '<th>상태</th>'+th('views','조회수')+'<th>액션</th></tr></thead><tbody>';
  var body;
  if(!list.length){
    body='<tr><td colspan="8"><div class="empty"><div class="big">🔍</div>'+
      (POSTS.length? '조건에 맞는 글이 없습니다.' : '아직 글이 없습니다.')+'</div></td></tr>';
  }else{
    body=list.map(function(p){
      var isTrash=p.status==='trash';
      var act=isTrash
        ? '<button onclick="doRestore(\''+p.file+'\',event)">복원</button>'
        : '<button onclick="goEdit(\''+p.file+'\')">수정</button>'+
          '<button onclick="doToggle(\''+p.file+'\',event)">'+(p.status==='published'?'비게시':'게시')+'</button>'+
          '<button class="del" onclick="doDelete(\''+p.file+'\',event)">삭제</button>';
      return '<tr>'+
        '<td class="title-cell">'+esc(p.title)+'<div class="sub">/'+p.category+'/'+p.slug+'/</div></td>'+
        '<td><span class="chip">'+CATL[p.category]+'</span> <span class="funnel">'+p.funnel+'</span></td>'+
        '<td>'+esc(p.author)+'</td>'+
        // 예약 글은 '발행일'이 아직 오지 않은 날짜다 — 시:분까지 보여줘야 오해가 없다
        '<td>'+p.date+(p.status==='scheduled'?'<div class="sub">'+esc(p.publish_at.slice(11))+' 공개</div>':'')+'</td>'+
        '<td>'+p.updated+'</td>'+
        '<td>'+statusBadge(p.status,p.pending)+'</td>'+
        '<td class="n">'+fmt(p.views)+'</td>'+
        '<td><div class="rowact">'+act+'</div></td></tr>';
    }).join('');
  }
  $('ptable').innerHTML=head+body+'</tbody></table>';
}
function sortBy(k){if(SORT.key===k)SORT.dir=SORT.dir==='asc'?'desc':'asc';else{SORT.key=k;SORT.dir='desc';}drawTable();}
function findPost(file){return POSTS.filter(function(p){return p.file===file})[0];}

// 쓰기 액션(비게시 토글·삭제·복원)은 이번 단계 범위 밖 — 안내만 하고 실제 변경은 없다.
function doToggle(file,e){return writeBlocked(e);}
function doDelete(file,e){return writeBlocked(e);}
function doRestore(file,e){return writeBlocked(e);}

/* =========================================================================
   화면 5 — 글 편집 (S-ADM-3-02)
   ========================================================================= */
// 편집 화면 — 이번 단계는 '읽기 전용'. 메타는 실데이터로 채우되 입력은 비활성(disabled),
// 저장/삭제는 눌러도 변경되지 않고 안내만 한다. 본문·저장은 다음 단계(백엔드 연동)에서 붙인다.
function renderEdit(v,file){
  var p=findPost(file);
  var head='<div class="pagehead"><h1>글 편집</h1><span class="meta">'+esc(file||'')+'</span><span class="sp"></span>'+
    '<a href="#/posts" class="btn">← 목록</a></div>';
  if(!p){
    v.innerHTML=head+'<div class="panel errbox"><div class="big">🔎</div>글을 찾을 수 없습니다.<br>'+
      '<button class="btn primary" style="margin-top:14px" onclick="location.hash=\'#/posts\'">목록으로</button></div>';
    return;
  }
  var catLabel=CATL[p.category]||p.category;
  var meta='<div class="panel"><h2>메타 정보 <span style="font-size:11px;font-weight:600;color:var(--muted)">(읽기 전용 · 이번 단계는 조회만)</span></h2><div class="form-grid">'+
    '<div class="field full"><label>제목</label><input value="'+esc(p.title)+'" disabled></div>'+
    '<div class="field"><label>카테고리</label><input value="'+esc(catLabel)+'" disabled></div>'+
    '<div class="field"><label>슬러그(slug)</label><input value="'+esc(p.slug)+'" disabled></div>'+
    '<div class="field"><label>퍼널(funnel)</label><input value="'+esc(p.funnel||'-')+'" disabled></div>'+
    '<div class="field"><label>저자</label><input value="'+esc(p.author)+'" disabled></div>'+
    '<div class="field"><label>발행일(date)</label><input value="'+esc(p.date||'-')+'" disabled></div>'+
    '<div class="field"><label>수정일(updated)</label><input value="'+esc(p.updated||'-')+'" disabled></div>'+
    '<div class="field"><label>경로</label><input value="'+esc(p.path)+'" disabled></div>'+
    '<div class="field"><label>조회수</label><input value="'+fmt(p.views)+'" disabled></div>'+
    '<div class="field"><label>게시 상태</label><div style="padding-top:6px">'+statusBadge(p.status)+'</div></div>'+
    '</div></div>';
  var body='<div class="panel"><h2>본문</h2>'+
    '<div class="empty"><div class="big">📝</div>본문 편집은 다음 단계입니다.<br>'+
    '<span style="font-size:12px">이번 콘솔은 <b>읽기 전용</b> — 조회수·글 메타 조회까지 제공합니다. '+
    '본문 에디터·저장은 백엔드 쓰기 연동(phase-2)에서 붙습니다.</span></div></div>';
  var actions='<div class="actionbar">'+
    '<button class="btn primary" id="savebtn" onclick="doSave(false)">저장</button>'+
    '<button class="btn" onclick="doSave(true)">저장 후 게시</button>'+
    '<span class="sp"></span>'+
    '<button class="btn" onclick="location.hash=\'#/posts\'">목록으로</button>'+
    '<button class="btn danger" onclick="doDelete(\''+esc(p.file)+'\',event)">삭제</button>'+
    '</div>';
  v.innerHTML=head+meta+body+
    '<div class="panel" style="padding:0;border:0;background:transparent;margin-bottom:0">'+actions+'</div>';
}
// 저장 계열은 이번 범위 밖 — 안내만.
function doSave(thenPublish){return writeBlocked();}

/* =========================================================================
   초기 부팅
     · file:// 로 직접 열면 fetch 불가 → 안내 후 중단(깨진 화면 금지).
     · sessionStorage 'bpw' 가 있으면 그 비번으로 자동 로드해 앱 진입.
     · 없거나 실패하면 로그인 게이트(기본 표시) 유지.
   ========================================================================= */
(function(){
  if(isFileProto()){showFileWarning();return;}
  var pw=sessionStorage.getItem('bpw');
  if(!pw)return;                       // 게이트가 기본 표시 상태
  PW=pw;DATASTATE='loading';
  loadData().then(function(){
    DATASTATE='ok';afterAuthLoaded();
  }).catch(function(err){
    PW=null;
    if(err&&err.code===401)sessionStorage.removeItem('bpw');  // 만료된 비번만 폐기
    // 네트워크·5xx면 비번은 남겨두고 게이트에서 재시도하게 둔다. 게이트는 이미 보이는 상태.
  });
})();
</script>
